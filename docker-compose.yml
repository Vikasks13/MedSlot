services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medslot_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=True
      - DATABASE_URL=postgresql+asyncpg://medslot_user:medslot_password@db:5432/medslot_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=medslot-super-secret-development-key-32-chars
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - PAYMENT_WEBHOOK_SECRET=whsec_medslot_mock_secret_key
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - medslot_network

  db:
    image: postgres:16-alpine
    container_name: medslot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: medslot_user
      POSTGRES_PASSWORD: medslot_password
      POSTGRES_DB: medslot_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medslot_user -d medslot_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - medslot_network

  redis:
    image: redis:7-alpine
    container_name: medslot_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - medslot_network

volumes:
  postgres_data:
  redis_data:

networks:
  medslot_network:
    driver: bridge
